TailorNet-master/
│
├── backend/              ← SERVER — nơi main.py chạy
│   ├── main.py                FastAPI app, chứa toàn bộ API endpoints
│   ├── measurements_to_beta.py  Chuyển số đo (cm/kg) → beta/gamma vectors
│   └── renderer.py            Render mesh 3D → ảnh PNG base64
│
├── models/               ← AI MODEL — trái tim của TailorNet
│   ├── tailornet_model.py     Load weights, chạy inference (tn_runner.forward)
│   ├── smpl4garment.py        SMPL body model + đính quần áo vào body
│   ├── torch_smpl4garment.py  Bản PyTorch của SMPL4Garment
│   ├── networks.py            Kiến trúc mạng neural
│   └── ops.py                 Các phép tính toán học cho model
│
├── utils/                ← TIỆN ÍCH — các hàm hỗ trợ
│   ├── interpenetration.py    Chống xuyên mesh (remove_interpenetration_fast)
│   ├── rotation.py            Chuẩn hóa góc xoay (normalize_y_rotation)
│   ├── geometry.py            Tính toán hình học 3D
│   ├── diffusion_smoothing.py Làm mượt bề mặt mesh
│   └── smpl_paths.py          Đường dẫn đến file model weights
│
├── visualization/        ← POSE DATA — dữ liệu tư thế người mẫu
│   ├── vis_utils.py           get_specific_pose(idx) — lấy pose theo index
│   ├── some_thetas.npy        File binary chứa 5 pose mẫu (theta vectors)
│   └── amass_sequences.npy    Tập hợp motion sequences lớn hơn
│
├── data/                 ← DỮ LIỆU MODEL — weights đã train sẵn
│   └── (smpl_models/, trained weights cho t-shirt/shirt/pant/short-pant...)
│
├── dataset/              ← DATASET — dữ liệu training gốc
│   └── (garment templates, UV maps...)
│
├── trainer/              ← TRAINING — code để train model mới
│   └── (dùng khi muốn train thêm garment type mới)
│
└── smpl_lib/             ← THƯ VIỆN SMPL — dependency ngoài
    └── (psbody.mesh, SMPL core library)
