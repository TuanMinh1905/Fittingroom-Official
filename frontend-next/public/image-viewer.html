<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer - Product Diagnostics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 20px;
        }
        h1 {
            color: #3b82f6;
        }
        .category-section {
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }
        .category-title {
            font-size: 24px;
            text-transform: uppercase;
            border-left: 5px solid #3b82f6;
            padding-left: 10px;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            padding: 10px;
            text-align: center;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #333;
        }
        .card-title {
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .card-url {
            font-size: 10px;
            color: #888;
            word-break: break-all;
            margin-top: 5px;
        }
    </style>
</head>

            'phu-kien': ['Thắt lưng da bò', 'Kính râm chống nắng', 'Vòng cổ kim loại', 'Đồng hồ thanh lịch', 'Túi chéo canvas', 'Ví da nam/nữ', 'Khuyên tai nữ', 'Nhẫn bạc 925', 'Khăn quàng cổ lụa', 'Găng tay len mịn']
        };

        const container = document.getElementById('container');
        for (const cat in productImages) {
            const section = document.createElement('div');
            section.className = 'category-section';

            const title = document.createElement('div');
            title.className = 'category-title';
            title.innerText = cat;
            section.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'grid';

            productImages[cat].forEach((url, i) => {
                const card = document.createElement('div');
                card.className = 'card';

                const img = document.createElement('img');
                img.src = url;
                img.alt = mockData[cat][i];
                card.appendChild(img);

                const cardTitle = document.createElement('div');
                cardTitle.className = 'card-title';
                cardTitle.innerText = `${i}: ${mockData[cat][i]}`;
                card.appendChild(cardTitle);

                const cardUrl = document.createElement('div');
                cardUrl.className = 'card-url';
                cardUrl.innerText = url;
                card.appendChild(cardUrl);

                grid.appendChild(card);
            });

            section.appendChild(grid);
            container.appendChild(section);
        }
    </script>
</body>
</html>
